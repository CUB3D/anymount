[package]
name = "anymount"
version = "0.1.0"
edition = "2024"

[dependencies]
genericfs = { path = "./genericfs"}
time = "=0.1.45" # old because fuse
clap = { version = "=4.6.6", features = ["derive"] }
anyhow = "=1.0.104"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tracing = "=0.1.44"
progression = "=0.1.15"
#serde_json = "=1.0.151"
#tokio = { version = "=1.53.1", features = ["rt"] }

#iced = { version = "=0.14.0", default-features = false, features = ["x11", "wayland", "wgpu", "tiny-skia", "smol"]}
#rfd = { version = "=0.17.2", }

[target.'cfg(target_os="linux")'.dependencies]
fuse = "=0.3.1"

[profile.dev.package."*"]
# Set the default for dependencies in Development mode.
opt-level = 3

[profile.release]
debug = "full"

[package.metadata.appiamge]
auto_link = true
auto_linux_exclude_list = [
    "libc.so",
    "libdl.so",
    "libpthread.so"
]
