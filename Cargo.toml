[package]
name = "anymount"
version = "0.1.0"
edition = "2024"

[dependencies]
zip = "=8.5.1"
time = "=0.1.45" # old because fuse
tar = {  path = "./vendor/tar-rs" }
lz4_flex = "0.13.0"
android-sparse = "=0.6.0"
clap = { version = "=4.6.0", features = ["derive"] }
anyhow = "=1.0.102"
parse = { git = "https://github.com/CUB3D/parse-rs", rev = "5f2c7befbc473706dbd3a229d356b0a5be504b41", features = ["alloc"] }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tracing = "=0.1.44"
memmap2 = "=0.9.10"
progression = "=0.1.15"
flate2 = "=1.1.9"
cpio = "=0.4.1"
bzip2 = { version = "=0.6.1" }
decode_raw = "=0.2.0"
abootimg-oxide = "=0.5.1"
openssl = { version = "=0.10.76", features = ["vendored"] }
ext4-view = "=0.9.3"
dtb = "=0.2.0"
qcow2 = { git = "https://github.com/CUB3D/qcow2-rs" }
positioned-io = "=0.3.5"
mbrman = "=0.6.1"
rust-lzo = "=0.6.2"
lzma-rust2 = "=0.16.2"
serde = "=1.0.228"
serde_json = "=1.0.149"
tokio = { version = "=1.51.0", features = ["rt"] }
rar-stream = { version = "=5.5.0", features = ["async", "crypto"] }

[target.'cfg(target_os="linux")'.dependencies]
fuse = "=0.3.1"

[profile.dev.package."*"]
# Set the default for dependencies in Development mode.
opt-level = 3

[profile.release]
debug = "full"

[package.metadata.appiamge]
auto_link = true
auto_linux_exclude_list = [
    "libc.so",
    "libdl.so",
    "libpthread.so"
]
