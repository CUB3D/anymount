[package]
name = "anymount"
version = "0.1.0"
edition = "2024"

[features]
default = ["with-fuse"]
with-fuse = ["fuser", "libc", "ctrlc"]

[dependencies]
genericfs = { path = "./genericfs"}
clap = { version = "=4.6.7", features = ["derive"] }
anyhow = "=1.0.104"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tracing = "=0.1.44"
progression = "=0.1.15"

iced = { version = "=0.14.0", default-features = false, features = ["x11", "wayland", "wgpu", "tiny-skia", "smol"]}
rfd = { version = "=0.17.2", }
libc = { version = "=0.2.189", optional = true }
ctrlc = { version = "=3.5.2", optional = true }

[target.'cfg(target_os="linux")'.dependencies]
fuser = { git = "https://github.com/cberner/fuser", rev = "1f45dc321bb8ddac892d667e02fa1d12ca73b168", optional = true } # pinned to last non-slop version

[profile.dev.package."*"]
# Set the default for dependencies in Development mode.
opt-level = 3

[profile.release]
debug = "full"

[package.metadata.appiamge]
auto_link = true
auto_linux_exclude_list = [
    "libc.so",
    "libdl.so",
    "libpthread.so"
]
